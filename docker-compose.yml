services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-adotapet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adotapet}
      POSTGRES_DB: ${DB_DATABASE:-adotapet}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - adotapet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-adotapet}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  adotapet_pg_data:
